name: Backend tests

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-format-check.yml'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-format-check.yml'
      - '.github/workflows/backend-tests.yml'

permissions:
  contents: read

jobs:
  test:
    name: Maven tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: instello
          POSTGRES_PASSWORD: instello@5432
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U instello -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_URL: jdbc:postgresql://localhost:5432/postgres
      POSTGRES_USER: instello
      POSTGRES_PASSWORD: instello@5432
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      MAIL_HOST: localhost
      MAIL_PORT: '1025'
      MAIL_USERNAME: ''
      MAIL_PASSWORD: ''
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run tests
        run: ./mvnw -B -DargLine= test
