spring:
  application:
    name: backend
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  data:
    # =========================================
    # Redis Configuration
    # =========================================
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      database: 0

      connect-timeout: 2s
      timeout: 2s

  # =========================================
  # Email Configuration
  # =========================================
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enabled: false

  # Thymeleaf email templates location and configuration
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: html
    encoding: UTF-8

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true
    properties:
      "[hibernate.jdbc.time_zone]": UTC
      hibernate:
        "[format_sql]": true

instello:
  cors:
    allowed-origins:
      - http://localhost:3000
  auth:
    otp:
      ttl: 10m
      resend-cooldown: 60s
      max-requests-per-hour: 5
      max-verify-attempts: 5
  bootstrap:
    admin:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
  mail:
    from: ${MAIL_FROM:noreply@instello.local}
  invitation:
    ttl: 7d
    accept-url: ${APP_INVITE_URL:http://localhost:3000/signup}

logging:
  level:
    "[org.hibernate.sql]": DEBUG

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /api-docs
  default-produces-media-type: application/json
  writer-with-order-by-keys: true
  override-with-generic-response: true
  open-api:
    servers:
      - url: http://localhost:8080
        description: Dev server (uses test data)
      - url: https://api.instello.in
        description: Production server (uses live data)
    info:
      version: 1.0.0
      title: Instello API
      summary: One Platform. Every Posibility.
      description: >
        Open API spec for Instello API. This follows standard security with CSRF protection.
        Admin follows simple email verification authentication where-as remaining users will
        have multiple authenticion options with email verification when they sign-up.
      terms-of-service:
        Copyright © 2026 Instello Technologies. All rights reserved.
        This repository and its contents are proprietary. No license or other permission is granted to use,
        reproduce, modify, distribute, or create derivative works from any part of this repository without prior
        written permission from Instello Technologies, except as permitted by applicable law.

        Third-party components included in this repository may be subject to separate licenses and notices.
        Their respective terms govern those components.
